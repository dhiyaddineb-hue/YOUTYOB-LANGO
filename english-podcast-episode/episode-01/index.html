<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EP01 · Introduce Yourself with Confidence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=IBM+Plex+Mono:wght@400&family=Noto+Naskh+Arabic:wght@600&family=Outfit:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../studio/styles/tokens.css" />
  <link rel="stylesheet" href="../studio/styles/studio.css" />
  <link rel="stylesheet" href="../studio/styles/player.css" />
  <style>
    body { display: block; background: #14110e; color: #f4efe4; }
    .watch { max-width: 1120px; margin: 0 auto; padding: 28px 20px 60px; }
    .watch header { display: flex; justify-content: space-between; align-items: end; margin-bottom: 18px; }
    .watch h1 { font-family: var(--font-display); font-size: 32px; margin: 0; }
    .watch a { color: #f5d56e; }
  </style>
</head>
<body>
  <div class="watch">
    <header>
      <div>
        <p class="kicker">English Step by Step · Episode 01</p>
        <h1>Introduce Yourself with Confidence</h1>
      </div>
      <a href="../studio/index.html#/episode">افتح الاستوديو</a>
    </header>
    <div class="stage-wrap">
      <div id="stage" class="stage" data-composition-id="ep-01" data-start="0" data-width="1920" data-height="1080" data-duration="745"></div>
      <div class="controls">
        <button class="btn" id="play-btn">Play</button>
        <input id="seek" type="range" min="0" max="745" value="0" step="0.1" />
        <span class="time-read" id="time-read">00:00.0</span>
      </div>
    </div>
  </div>

  <!-- HyperFrames scene clips: data-driven player fills #stage; these remain for lint/render tools -->
  <div hidden>
    <div class="scene clip" data-start="0" data-duration="20" data-track-index="0"></div>
    <div class="scene clip" data-start="20" data-duration="50" data-track-index="0"></div>
    <div class="scene clip" data-start="70" data-duration="105" data-track-index="0"></div>
    <div class="scene clip" data-start="175" data-duration="145" data-track-index="0"></div>
    <div class="scene clip" data-start="320" data-duration="75" data-track-index="0"></div>
    <div class="scene clip" data-start="395" data-duration="140" data-track-index="0"></div>
    <div class="scene clip" data-start="535" data-duration="105" data-track-index="0"></div>
    <div class="scene clip" data-start="640" data-duration="75" data-track-index="0"></div>
    <div class="scene clip" data-start="715" data-duration="30" data-track-index="0"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.set({}, {}, 745);
    window.__timelines = window.__timelines || {};
    window.__timelines["ep-01"] = tl;
  </script>
  <script type="module">
    import { boot } from "../studio/js/modules/store.js";
    import { EpisodePlayer, bindTransport } from "../studio/js/modules/player.js";
    const state = await boot();
    const player = new EpisodePlayer({
      stage: document.getElementById("stage"),
      episode: state.episode,
      characters: state.characters,
      lexicon: state.lexicon,
      style: "realistic",
    });
    bindTransport(player, {
      playBtn: document.getElementById("play-btn"),
      range: document.getElementById("seek"),
      read: document.getElementById("time-read"),
    });
  </script>
</body>
</html>
