<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EP01 · Introduce Yourself with Confidence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=IBM+Plex+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #f4efe4; --teal: #0f766e; --gold: #f5d56e; --mustard: #d4a017;
      --ink: #14110e; --maya: #d4a017; --omar: #0284c7; --sami: #0f766e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0b0908; color: var(--cream); font-family: Outfit, "Noto Naskh Arabic", sans-serif; }
    .page { max-width: 1180px; margin: 0 auto; padding: 22px 18px 48px; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 14px; }
    .kicker { margin: 0; letter-spacing: .18em; text-transform: uppercase; font-size: 11px; color: #a8a29e; }
    h1 { margin: 4px 0 0; font-family: Fraunces, serif; font-size: clamp(22px, 3vw, 34px); font-weight: 560; }
    .links a { color: var(--gold); text-decoration: none; margin-inline-start: 14px; font-size: 14px; }

    .screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 18px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
    }
    .bg { position: absolute; inset: 0; background: center/cover no-repeat; transform: scale(1.08); animation: ken 22s ease-in-out infinite alternate; }
    @keyframes ken { to { transform: scale(1.16) translate3d(-1.5%, -1%, 0); } }
    .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,8,6,.2), rgba(10,8,6,.62) 70%, rgba(10,8,6,.82)); }
    .layer { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 4.2% 5%; }
    .series { display: flex; justify-content: space-between; font-size: clamp(11px, 1.4vw, 15px); letter-spacing: .14em; text-transform: uppercase; color: rgba(244,239,228,.7); }
    .ep { background: var(--teal); color: #fff; padding: 4px 10px; border-radius: 999px; letter-spacing: .06em; }

    .body { flex: 1; display: grid; place-items: center; min-height: 0; }
    .hero { text-align: center; }
    .hero h2 { font-family: Fraunces, serif; font-size: clamp(28px, 4.6vw, 64px); margin: 0 0 8px; line-height: 1.05; }
    .hero p { margin: 0; color: var(--gold); font-size: clamp(16px, 2vw, 26px); }
    .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
    .chips span { background: rgba(255,250,241,.12); border: 1px solid rgba(255,255,255,.12); padding: 6px 12px; border-radius: 999px; font-size: clamp(11px, 1.4vw, 16px); }

    .faces { display: flex; justify-content: center; align-items: end; gap: 3.2%; width: 100%; height: 100%; }
    .face { width: 27%; max-width: 260px; opacity: .34; filter: grayscale(.4); transition: .35s; }
    .face.on { opacity: 1; filter: none; transform: translateY(-4%); }
    .face img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 16px; border: 3px solid transparent; display: block; }
    .face.on img { border-color: var(--who, #fff); }
    .face b { display: block; text-align: center; margin-top: 8px; font-size: clamp(12px, 1.4vw, 16px); }

    .card {
      width: min(82%, 760px);
      background: rgba(255,250,241,.96);
      color: #1c1917;
      border-radius: 22px;
      padding: 3.4% 4.4%;
      text-align: center;
    }
    .card .en { font-family: Fraunces, serif; font-size: clamp(26px, 3.8vw, 52px); margin: 0; line-height: 1.15; }
    .card .ipa { color: var(--teal); margin: 6px 0; font-family: "IBM Plex Mono", monospace; }
    .card .ar { font-family: "Noto Naskh Arabic", serif; font-size: clamp(18px, 2.2vw, 28px); margin: 0; }
    .card .ex, .card .ans { margin: 10px 0 0; color: #44403c; font-size: clamp(14px, 1.8vw, 22px); }
    .turn { display: inline-block; margin-top: 10px; background: var(--teal); color: #fff; padding: 6px 14px; border-radius: 999px; }

    .rail { min-height: 22%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; }
    .who { font-size: 12px; font-weight: 700; color: #111; padding: 3px 10px; border-radius: 99px; }
    .cap { max-width: 88%; background: rgba(12,10,8,.72); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 10px 18px 12px; text-align: center; }
    .cap .en { margin: 0; font-size: clamp(16px, 2.15vw, 28px); font-weight: 600; line-height: 1.25; }
    .cap .ar { margin: 4px 0 0; font-family: "Noto Naskh Arabic", serif; font-size: clamp(15px, 1.9vw, 24px); direction: rtl; color: #f5e6c8; }
    .kw-name { color: #fb7185; } .kw-question { color: #7dd3fc; } .kw-verb { color: #5eead4; }
    .kw-place { color: #fbbf24; } .kw-polite { color: #c4b5fd; } .kw-time { color: #fdba74; }

    .bar { display: flex; align-items: center; gap: 10px; padding: 12px 4px 0; }
    button.play { background: var(--teal); color: #fff; border: 0; border-radius: 12px; padding: 10px 18px; font: 700 14px Outfit, sans-serif; cursor: pointer; }
    button.ghost { background: transparent; color: var(--cream); border: 1px solid rgba(255,255,255,.18); }
    input[type=range] { flex: 1; accent-color: var(--teal); }
    .time { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: #d6d3d1; min-width: 110px; }

    .overlay {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: rgba(8,6,5,.35);
      cursor: pointer;
    }
    .overlay.hidden { display: none; }
    .poster { position: absolute; inset: 0; background: center/cover no-repeat; filter: brightness(.55); }
    .go {
      position: relative; width: 92px; height: 92px; border-radius: 50%;
      background: var(--teal); color: #fff; display: grid; place-items: center;
      font-size: 34px; box-shadow: 0 12px 40px rgba(0,0,0,.4);
    }
    .meta { margin-top: 16px; color: #a8a29e; font-size: 14px; display: flex; gap: 18px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <div>
        <p class="kicker">English Step by Step · Episode 01</p>
        <h1>Introduce Yourself with Confidence</h1>
      </div>
      <div class="links">
        <a href="../studio/index.html">الاستوديو</a>
      </div>
    </header>

    <div class="screen" id="screen">
      <div class="bg" id="bg"></div>
      <div class="veil"></div>
      <div class="layer">
        <div class="series">
          <span>English Step by Step</span>
          <span class="ep">EP 01</span>
        </div>
        <div class="body" id="body"></div>
        <div class="rail">
          <div class="who" id="who" hidden></div>
          <div class="cap" id="cap" hidden>
            <p class="en" id="en"></p>
            <p class="ar" id="ar"></p>
          </div>
        </div>
      </div>
      <div class="overlay" id="overlay">
        <div class="poster" id="poster"></div>
        <div class="go">▶</div>
      </div>
    </div>

    <div class="bar">
      <button class="play" id="play">تشغيل الفيديو</button>
      <button class="play ghost" id="back">من البداية</button>
      <input id="seek" type="range" min="0" max="1000" value="0" />
      <span class="time" id="time">00:00 / 00:00</span>
    </div>
    <p class="meta">
      <span>ثلاثة أصوات: سامي · Maya · Omar</span>
      <span>كابشن إنجليزي + عربي</span>
      <span id="durLabel">جاري التحميل…</span>
    </p>
  </div>

  <script type="module">
    const LEX = {
      name: "name", maya: "name", omar: "name", sami: "name",
      what: "question", "what's": "question", what’s: "question", where: "question", how: "question",
      do: "verb", like: "verb", meet: "verb", talking: "verb", take: "verb", read: "verb", drink: "verb",
      from: "place", york: "place", california: "place", city: "place",
      nice: "polite", free: "time", time: "time"
    };
    const paint = (text) => (text || "").split(/(\s+)/).map((tok) => {
      if (/^\s+$/.test(tok)) return tok;
      const c = LEX[tok.toLowerCase().replace(/[^a-z'’]/g, "")];
      return c ? `<span class="kw-${c}">${tok}</span>` : tok;
    }).join("");
    const fmt = (t) => {
      t = Math.max(0, t || 0);
      const m = Math.floor(t / 60), s = Math.floor(t % 60);
      return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    };

    const here = new URL("./", location.href);
    const abs = (p) => new URL(p, here).href;
    let film;
    try {
      const res = await fetch(abs("film.json"), { cache: "no-store" });
      if (!res.ok) throw new Error("film.json " + res.status);
      film = await res.json();
    } catch (err) {
      document.body.innerHTML = `<div style="padding:24px;font-family:sans-serif">تعذّر تحميل الفيديو: ${err.message}</div>`;
      throw err;
    }
    const shots = film.shots;
    const audio = shots.map((s) => {
      const a = new Audio(abs(s.audio));
      a.preload = "auto";
      return a;
    });

    await Promise.all(audio.map((a) => new Promise((res) => {
      if (a.readyState >= 1) return res();
      a.addEventListener("loadedmetadata", res, { once: true });
      a.addEventListener("error", res, { once: true });
    })));

    const durations = audio.map((a) => (Number.isFinite(a.duration) ? a.duration : 3));
    const pads = shots.map((s) => (s.pad || 300) / 1000);
    const starts = [];
    let acc = 0;
    shots.forEach((_, i) => { starts.push(acc); acc += durations[i] + pads[i]; });
    const total = acc;
    document.getElementById("durLabel").textContent = `المدة ${fmt(total)}`;
    document.getElementById("time").textContent = `00:00 / ${fmt(total)}`;
    document.getElementById("poster").style.backgroundImage = `url("${abs(film.thumbnail)}")`;
    document.getElementById("seek").max = Math.floor(total * 10);

    const els = {
      bg: document.getElementById("bg"),
      body: document.getElementById("body"),
      who: document.getElementById("who"),
      cap: document.getElementById("cap"),
      en: document.getElementById("en"),
      ar: document.getElementById("ar"),
      overlay: document.getElementById("overlay"),
      play: document.getElementById("play"),
      seek: document.getElementById("seek"),
      time: document.getElementById("time"),
    };

    let playing = false, shotIndex = 0, shotStartPerf = 0, raf = 0, currentAudio = null, seeking = false;

    function itemAt(shot, localT, dur) {
      if (!shot.items?.length) return null;
      const p = dur ? Math.min(.999, localT / dur) : 0;
      return shot.items[Math.floor(p * shot.items.length)];
    }

    function draw(i, localT) {
      const shot = shots[i];
      const dur = durations[i];
      const vis = film.visuals[shot.visual] || film.visuals.studio;
      els.bg.style.backgroundImage = `url("${abs(vis)}")`;
      const who = film.cast[shot.speaker];
      const item = itemAt(shot, localT, dur);

      if (shot.type === "title") {
        els.body.innerHTML = `<div class="hero"><h2>${film.title}</h2><p>${film.titleAr}</p></div>`;
      } else if (shot.type === "host") {
        const chips = (shot.chips || []).map((c) => `<span>${c}</span>`).join("");
        els.body.innerHTML = `<div class="hero"><h2>Five sentences</h2><p>${shot.ar}</p><div class="chips">${chips}</div></div>`;
      } else if (shot.type === "dialogue") {
        els.body.innerHTML = ["maya","sami","omar"].map((id) => {
          const c = film.cast[id];
          const on = id === shot.speaker ? "on" : "";
          return `<div class="face ${on}" style="--who:${c.color}"><img src="${abs(c.photo)}" alt="${c.nameEn}"><b>${c.nameEn}</b></div>`;
        }).join("");
        els.body.className = "body faces";
      } else if (shot.type === "explain") {
        const it = item || shot.items[0];
        els.body.className = "body";
        els.body.innerHTML = `<article class="card"><p class="en">${it.en}</p><p class="ar">${it.ar}</p></article>`;
      } else if (shot.type === "vocab") {
        const it = item || shot.items[0];
        els.body.className = "body";
        els.body.innerHTML = `<article class="card"><p class="en">${it.en}</p><p class="ipa">${it.ipa}</p><p class="ar">${it.ar}</p><p class="ex">${it.ex}</p></article>`;
      } else if (shot.type === "drill") {
        const it = item || shot.items[0];
        const late = (localT / dur) % (1 / shot.items.length) > 0.45;
        els.body.className = "body";
        els.body.innerHTML = `<article class="card"><p class="en">${it.en}</p><p class="ar">${it.ar}</p>${late ? '<span class="turn">Your turn · دورك الآن</span>' : ""}</article>`;
      } else if (shot.type === "quiz") {
        const it = item || shot.items[0];
        const late = (localT / dur) % (1 / shot.items.length) > 0.5;
        els.body.className = "body";
        els.body.innerHTML = `<article class="card"><p class="ar">${it.ar}</p><p class="en">${it.en}</p>${late ? `<p class="ans">${it.a}<br>${it.aAr}</p>` : "<p class='ex'>فكّر…</p>"}</article>`;
      } else if (shot.type === "outro") {
        els.body.className = "body";
        els.body.innerHTML = `<div class="hero"><h2>Your turn in the comments</h2><p>${shot.next}</p></div>`;
      }
      if (shot.type !== "dialogue") els.body.className = "body";

      if (who && shot.en) {
        els.who.hidden = false;
        els.who.textContent = who.nameEn;
        els.who.style.background = who.color;
        els.cap.hidden = false;
        els.en.innerHTML = paint(item?.en && shot.type !== "dialogue" ? (shot.type === "explain" ? item.en : shot.en) : shot.en);
        els.ar.textContent = shot.ar;
      }
    }

    function globalTime() {
      if (!playing || !currentAudio) return starts[shotIndex] + 0;
      return starts[shotIndex] + currentAudio.currentTime;
    }

    function tick() {
      if (!playing) return;
      const t = globalTime();
      els.seek.value = Math.floor(t * 10);
      els.time.textContent = `${fmt(t)} / ${fmt(total)}`;
      draw(shotIndex, currentAudio ? currentAudio.currentTime : 0);
      raf = requestAnimationFrame(tick);
    }

    async function playFrom(i, offset = 0) {
      if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
      if (i >= shots.length) { stop(true); return; }
      shotIndex = i;
      els.overlay.classList.add("hidden");
      playing = true;
      els.play.textContent = "إيقاف";
      currentAudio = audio[i];
      try { currentAudio.currentTime = offset; } catch {}
      draw(i, offset);
      try { await currentAudio.play(); } catch (e) { console.warn(e); }
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(tick);
      currentAudio.onended = () => {
        setTimeout(() => playFrom(i + 1), shots[i].pad || 300);
      };
    }

    function stop(ended = false) {
      playing = false;
      cancelAnimationFrame(raf);
      if (currentAudio) currentAudio.pause();
      els.play.textContent = ended ? "إعادة التشغيل" : "تشغيل الفيديو";
      if (ended) els.overlay.classList.remove("hidden");
    }

    function findShot(t) {
      for (let i = shots.length - 1; i >= 0; i--) if (t >= starts[i]) return i;
      return 0;
    }

    els.play.onclick = () => {
      if (playing) stop();
      else playFrom(shotIndex, currentAudio ? currentAudio.currentTime : 0);
    };
    document.getElementById("back").onclick = () => playFrom(0, 0);
    els.overlay.onclick = () => playFrom(0, 0);
    els.seek.onchange = () => {
      const t = Number(els.seek.value) / 10;
      const i = findShot(t);
      playFrom(i, Math.max(0, t - starts[i]));
    };

    draw(0, 0);
  </script>
</body>
</html>
