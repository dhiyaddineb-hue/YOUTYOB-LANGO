<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>مشغّل الفيلم</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#ddd;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
  .bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(#000c,transparent);z-index:5}
  .bar a{color:#cfcfcf;text-decoration:none;font-size:.85rem;border:1px solid #444;border-radius:8px;padding:5px 12px;background:#0007}
  .bar .t{font-weight:700;font-size:1rem;color:#fff}
  video{position:fixed;inset:0;width:100%;height:100%;background:#000}
</style>
</head>
<body>
  <div class="bar"><a href="download.html">⬇ التحميل</a><span class="t" id="t"></span></div>
  <video id="v" controls preload="metadata" playsinline>
  </video>
<script>
  const eps = {
    "07": ["مقهى ممطر · Rainy Café", "11:58"],
    "08": ["الأرض نائمة · EARTH, SLEEPING", "16:38"],
    "09": ["ألاسكا بعد الثلج · ALASKA AFTER SNOW", "7:38"],
    "10": ["الغابة بعد أن تنام الشمس · THE NIGHT FOREST", "7:41"],
    "11": ["الصحراء بعد منتصف الليل · SAHARA AFTER MIDNIGHT", "7:51"],
    "12": ["المحيط بعد الغروب · OCEAN AFTER DARK", "8:05"],
  };
  const ep = (new URLSearchParams(location.search).get("ep") || "12").replace(/\D/g,"").padStart(2,"0");
  const dir = `episode-${ep}`;
  const v = document.getElementById("v");
  v.src = `${dir}/film-720p.mp4`;
  for (const [file, lang, label, def] of [["episode-ar.vtt","ar","العربية",true],["episode-en.vtt","en","English",false]]) {
    const tr = document.createElement("track");
    tr.kind = "subtitles"; tr.src = `${dir}/captions/${file}`;
    tr.srclang = lang; tr.label = label; if (def) tr.default = true;
    v.appendChild(tr);
  }
  document.getElementById("t").textContent = (eps[ep] ? `الحلقة ${ep.replace(/^0/,"")} — ${eps[ep][0]} · ${eps[ep][1]}` : dir);
  document.title = document.getElementById("t").textContent;
  v.addEventListener("error", () => { document.getElementById("t").textContent = "الفيلم غير موجود — عود إلى صفحة التحميل"; });
</script>
</body>
</html>
